name: Update web-end
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
# Two runs at once could both try to push the same update.
concurrency: update-web-end
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update to the latest release
        run: |
          set -e
          latest=$(curl -fsSL https://raw.githubusercontent.com/michoder26-cloud/web-end/main/cloud/latest.json | node -pe 'JSON.parse(require("fs").readFileSync(0)).version')
          # A release tagged without its last ".0", such as v0.18 for 0.18.0, still updates.
          git clone --depth 1 --branch "v$latest" https://github.com/michoder26-cloud/web-end.git /tmp/web-end || git clone --depth 1 --branch "v${latest%.0}" https://github.com/michoder26-cloud/web-end.git /tmp/web-end
          node /tmp/web-end/cloud/scripts/update.mjs /tmp/web-end/cloud "$GITHUB_WORKSPACE"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "web-end updater"
          git config user.email "updater@users.noreply.github.com"
          git commit -m "Update web-end to $latest"
          git push
