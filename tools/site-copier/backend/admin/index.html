<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back office</title><link rel="stylesheet" href="/admin/style.css"></head>
<body><div class="wrap">
<header class="top"><h1 data-w="title">Back office</h1><a class="btn" href="/" target="_blank" data-w="viewSite">View site</a><button class="btn" id="out" data-w="signout">Sign out</button></header>
<div id="first" class="alert" hidden data-w="firstPw"></div>
<nav class="tabs" role="tablist"><button role="tab" data-tab="inbox" aria-selected="true"><span data-w="inbox">Messages</span><span id="unread" class="badge" hidden></span></button><button role="tab" data-tab="pages" data-w="pages">Edit pages</button><button role="tab" data-tab="settings" data-w="settings">Settings</button></nav>
<section id="tab-inbox" class="card"><div class="row" style="justify-content:space-between"><h2 data-w="inbox">Messages</h2><a class="btn" href="/admin/api/messages.csv" data-w="csv">Download</a></div><div id="list"></div></section>
<section id="tab-pages" hidden><div class="card"><h2 data-w="pages">Edit pages</h2><p class="muted" data-w="pagesHelp"></p><div id="pagelist" class="pages"></div></div><div class="card"><h2 data-w="recent">Recent changes</h2><div id="changes" class="muted"></div></div></section>
<section id="tab-settings" hidden><div class="card"><h2 data-w="changePw">Change password</h2><form id="pwform"><label class="f" for="cur" data-w="current"></label><input class="f" id="cur" type="password" autocomplete="current-password" required><label class="f" for="nx" data-w="next"></label><input class="f" id="nx" type="password" autocomplete="new-password" minlength="8" required><p id="pwmsg" class="muted" role="status"></p><button class="btn primary" data-w="save">Save</button></form></div><div class="card"><p class="muted" data-w="backups"></p></div></section>
</div><script src="/admin/words.js"></script><script src="/admin/admin.js"></script></body></html>
